name: Build

on: [push, pull_request]

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@01aecccf739ca6ff86c0539fbc67a7a5007bbc81  # v2.1.0
      - name: Set up JDK
        uses: actions/setup-java@b74d5a6a962763ad3655696a314a4b34df4896c2  # v1.3.0
        with:
          java-version: 8
          server-id: ossrh
          server-username: SONATYPE_USER
          server-password: SONATYPE_PW

      - name: Build native
        run: |
          cmake -B cmake-build
          cmake --build cmake-build --config Release --verbose --target install

      - name: Build
        run: mvn -B package

      - name: Attach jars
        uses: actions/upload-artifact@82c141cc518b40d92cc801eee768e7aafc9c2fa2  # v2
        with:
          name: jar
          path: target/growl4j-*

      - name: Extract Branch Name
        run: echo "::set-env name=BRANCH::$(echo ${GITHUB_REF#refs/heads/})"

      - name: Release to Maven Central
        if: env.BRANCH == 'master'
        env:
          SONATYPE_USER: ${{ secrets.SONATYPE_USER }}
          SONATYPE_PW: ${{ secrets.SONATYPE_PW }}
        run: |
          cat <(echo -e "${{ secrets.GPG_KEY }}") | gpg --batch --import
          gpg --list-secret-keys --keyid-format LONG
          mvn \
            --no-transfer-progress \
            --batch-mode \
            -Dgpg.passphrase="${{ secrets.GPG_PW }}" \
            -DperformRelease=true \
            deploy
